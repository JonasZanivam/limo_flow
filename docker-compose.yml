services:
  postgres:
    image: postgres:16-alpine
    container_name: limoflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-limoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limoflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-limoflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-limoflow} -d ${POSTGRES_DB:-limoflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: limoflow-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@limoflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
